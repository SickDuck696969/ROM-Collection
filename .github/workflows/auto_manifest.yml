name: Auto-Generate Manifest

# Trigger the workflow when pushing to the master branch
on:
  push:
    branches:
      - master
    # Ignore pushes that only change the manifest or the workflow itself to prevent infinite loops
    paths-ignore:
      - 'manifest.json'
      - '.github/workflows/**'

# Grant permission for the action to push code back to your repo
permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code (Super-optimized)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: 'blob:none'
          sparse-checkout: |
            # Only download the root level files/folders needed for the manifest script
            # Add any specific directories your python script actually reads, or leave empty to grab only root files
            generate_manifest.py

      # 2. Set up Python (skip this step if your script is a bash script or something else)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Run your generator script
      - name: Run generate_manifest.py
        run: python generate_manifest.py  # <-- Change this if your script has a different name

      # 4. Commit and push the updated manifest.json
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          
          # Check if there are actually changes to commit
          if ! git diff --staged --quiet; then
            # The [skip ci] tag prevents this commit from triggering another GitHub Action run
            git commit -m "Auto-update manifest.json [skip ci]"
            git push
          else
            echo "No changes to manifest.json"
          fi