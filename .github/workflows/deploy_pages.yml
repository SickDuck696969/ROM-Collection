name: Deploy Website to Pages

on:
  push:
    branches: ["master"]
    # We only want this to run when the website or manifest updates, 
    # not every time you upload a single ROM.
    paths:
      - 'index.html'
      - 'manifest.json'
      - '**/cover.png'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Website Files (Ignore ROMs)
        run: |
          mkdir _site
          # Copy the core web files
          cp index.html _site/
          cp manifest.json _site/
          
          # Copy all cover.png files while keeping their console folder structure
          find . -name 'cover.png' -exec cp --parents \{\} _site/ \;
          
          echo "Website files successfully isolated from ROMs!"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only upload our lightweight '_site' folder, ignoring everything else
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
