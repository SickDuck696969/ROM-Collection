<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROM Collection</title>
    <!-- Retro Fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #141414;
            --bg-hover: #1e1e1e;
            --text-main: #32ff64; /* Terminal Green */
            --text-muted: #228b3d;
            --accent-cyan: #00ffff;
            --accent-pink: #ff00ff;
            --accent-green: #32ff64;
            --border-width: 3px;
        }

        /* --- Global Resets & CRT Effect --- */
        * {
            box-sizing: border-box;
        }

        /* CRT Scanline Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 9999;
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); border-left: 2px solid var(--text-muted); }
        ::-webkit-scrollbar-thumb { background: var(--text-main); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-y: scroll;
            font-size: 1.2rem;
            text-shadow: 0 0 5px rgba(50, 255, 100, 0.3);
        }

        /* --- Header / Navigation --- */
        header {
            background-color: var(--bg-dark);
            border-bottom: var(--border-width) solid var(--accent-pink);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 0px rgba(255, 0, 255, 0.3);
        }

        .brand h1 {
            margin: 0;
            font-family: 'Press Start 2P', monospace;
            color: var(--accent-cyan);
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            text-shadow: 3px 3px 0px var(--accent-pink);
        }

        .search-container {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        #searchInput {
            width: 100%;
            padding: 12px 15px;
            border: var(--border-width) solid var(--text-main);
            background-color: #000;
            color: var(--text-main);
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            outline: none;
            text-transform: uppercase;
        }

        #searchInput::placeholder { color: var(--text-muted); }
        #searchInput:focus {
            border-color: var(--accent-cyan);
            background-color: #051414;
            box-shadow: inset 0 0 10px var(--accent-cyan);
        }

        .download-app-btn {
            background-color: #000;
            color: var(--accent-pink);
            border: var(--border-width) solid var(--accent-pink);
            text-decoration: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--accent-pink);
            transition: all 0.1s;
        }

        .download-app-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--accent-pink);
            background-color: var(--accent-pink);
            color: #000;
        }

        /* --- Main Content Area --- */
        main {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: var(--border-width) dashed var(--text-muted);
            padding-bottom: 12px;
        }

        .section-header h2 {
            margin: 0;
            font-family: 'Press Start 2P', monospace;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .other-header {
            margin-top: 60px;
        }

        .back-btn {
            background-color: #000;
            border: var(--border-width) solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 10px 15px;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 3px 3px 0px var(--accent-cyan);
            display: none;
        }

        .back-btn:hover {
            background-color: var(--accent-cyan);
            color: #000;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--accent-cyan);
        }

        /* --- Grid System --- */
        .console-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .console-card {
            background-color: #000;
            border: var(--border-width) solid var(--text-main);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 6px 6px 0px var(--text-muted);
            transition: all 0.1s;
        }

        .console-card:hover {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px var(--accent-pink);
            border-color: var(--accent-pink);
        }

        .console-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-bottom: var(--border-width) solid var(--text-main);
            filter: contrast(120%) grayscale(20%);
        }
        
        .console-card:hover .console-cover {
            border-bottom-color: var(--accent-pink);
            filter: none;
        }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .console-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: var(--text-main);
            margin: 0 0 12px 0;
            line-height: 1.4;
        }
        
        .console-card:hover .console-title { color: var(--accent-pink); }

        .item-count {
            font-size: 1.2rem;
            color: #000;
            background-color: var(--text-main);
            padding: 2px 8px;
            text-transform: uppercase;
        }

        .console-card:hover .item-count {
            background-color: var(--accent-pink);
        }

        /* --- ROM List --- */
        .rom-list-container {
            display: none;
            background-color: #000;
            border: var(--border-width) solid var(--text-main);
            box-shadow: 8px 8px 0px var(--text-muted);
        }

        .rom-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 2px dashed var(--text-muted);
            flex-wrap: wrap;
            gap: 10px;
        }

        .rom-item:last-child { border-bottom: none; }
        .rom-item:hover { background-color: var(--bg-hover); }
        
        .rom-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .rom-name {
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .rom-console-badge {
            font-size: 1rem;
            color: var(--accent-cyan);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .download-btn {
            background-color: var(--text-main);
            color: #000;
            text-decoration: none;
            padding: 8px 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            text-transform: uppercase;
            box-shadow: 3px 3px 0px var(--text-muted);
            transition: all 0.1s;
        }

        .download-btn:hover {
            background-color: var(--accent-cyan);
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--accent-pink);
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            grid-column: 1 / -1;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 700px) {
            header { 
                flex-direction: column; 
                text-align: center; 
                padding: 15px; 
            }
            .brand h1 { font-size: 1rem; }
            .search-container { 
                max-width: 100%; 
                margin: 10px 0; 
                width: 100%;
            }
            .download-app-btn {
                width: 100%;
                justify-content: center;
                padding: 12px;
            }
            .console-grid { 
                /* Shrinks cards on mobile so 2 can fit side-by-side */
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
                gap: 15px;
            }
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .back-btn { width: 100%; }
            .rom-name { font-size: 1.2rem; }
            .download-btn {
                width: 100%;
                text-align: center;
                padding: 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1 onclick="goHome()">> ROM Collection_</h1>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="C:\SEARCH_DATABASE...">
        </div>
        <a class="download-app-btn" href="https://github.com/SickDuck696969/ROM_Downloader/releases/download/v1.0/ROM_Downloader.nro">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M21 15v4H3v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            SWITCH_APP.EXE
        </a>
    </header>

    <main>
        <!-- Main Header -->
        <div class="section-header" id="mainHeaderWrapper">
            <h2 id="viewTitle">Select_Console</h2>
            <button id="backBtn" class="back-btn" onclick="goHome()">< RETURN</button>
        </div>

        <!-- Grid View for Consoles -->
        <div id="consoleGrid" class="console-grid">
            <div class="empty-state">LOADING_DATABASE...</div>
        </div>

        <!-- Header for Other (eBook, Music) -->
        <div class="section-header other-header" id="otherHeaderWrapper" style="display: none;">
            <h2>Other_Media</h2>
        </div>

        <!-- Grid View for Other Media -->
        <div id="otherGrid" class="console-grid" style="display: none;">
        </div>

        <!-- List View for ROMs (and Search Results) -->
        <div id="romListContainer" class="rom-list-container">
            <!-- Items injected here via JS -->
        </div>
    </main>

    <script>
        const MANIFEST_URL = "./manifest.json";
        
        let allRoms = [];
        let consolesMap = {};
        
        // DOM Elements
        const consoleGrid = document.getElementById('consoleGrid');
        const otherGrid = document.getElementById('otherGrid');
        const romListContainer = document.getElementById('romListContainer');
        
        const viewTitle = document.getElementById('viewTitle');
        const otherHeaderWrapper = document.getElementById('otherHeaderWrapper');
        const backBtn = document.getElementById('backBtn');
        const searchInput = document.getElementById('searchInput');

        // State
        let currentViewConsole = null;

        async function init() {
            try {
                const response = await fetch(MANIFEST_URL);
                const data = await response.json();
                
                // Parse Data
                data.forEach(item => {
                    if (!consolesMap[item.console]) {
                        consolesMap[item.console] = [];
                    }
                    if (item.name !== ".empty" && item.downloadUrl) {
                        consolesMap[item.console].push(item);
                        allRoms.push(item);
                    }
                });

                renderGrids();

            } catch (error) {
                consoleGrid.innerHTML = `<div class="empty-state">ERROR: MANIFEST_NOT_FOUND</div>`;
                console.error("Error fetching manifest:", error);
            }
        }

        function createCardHtml(categoryName, countLabel) {
            const count = consolesMap[categoryName].length;
            const coverUrl = `./${encodeURIComponent(categoryName)}/cover.png`;
            
            const card = document.createElement('div');
            card.className = 'console-card';
            card.onclick = () => showItemsForCategory(categoryName);
            
            card.innerHTML = `
                <img src="${coverUrl}" class="console-cover" alt="${categoryName} cover" 
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/400x400/0c1219/32c8ff?text=${encodeURIComponent(categoryName)}';">
                <div class="card-content">
                    <h3 class="console-title">${categoryName}</h3>
                    <span class="item-count">${count} ${countLabel}</span>
                </div>
            `;
            return card;
        }

        function renderGrids() {
            currentViewConsole = null;
            viewTitle.textContent = "Select_Console";
            backBtn.style.display = "none";
            romListContainer.style.display = "none";
            
            consoleGrid.style.display = "grid";
            consoleGrid.innerHTML = "";
            otherGrid.innerHTML = "";

            const categories = Object.keys(consolesMap).sort();

            // Split categories into Main Consoles and Other (eBook, Music)
            const mainConsoles = categories.filter(c => c !== 'eBook' && c !== 'Music');
            const otherCategories = categories.filter(c => c === 'eBook' || c === 'Music');

            // Render Main Consoles
            mainConsoles.forEach(consoleName => {
                const card = createCardHtml(consoleName, 'FILES');
                consoleGrid.appendChild(card);
            });

            // Render Other Media
            if (otherCategories.length > 0) {
                otherHeaderWrapper.style.display = "flex";
                otherGrid.style.display = "grid";
                
                otherCategories.forEach(categoryName => {
                    const label = categoryName === 'eBook' ? 'BOOKS' : 'TRACKS';
                    const card = createCardHtml(categoryName, label);
                    otherGrid.appendChild(card);
                });
            } else {
                otherHeaderWrapper.style.display = "none";
                otherGrid.style.display = "none";
            }
        }

        function showItemsForCategory(categoryName) {
            currentViewConsole = categoryName;
            
            // Adjust the view title based on what they clicked
            if (categoryName === 'eBook') {
                viewTitle.textContent = `DIR: EBOOKS`;
            } else if (categoryName === 'Music') {
                viewTitle.textContent = `DIR: MUSIC`;
            } else {
                viewTitle.textContent = `DIR: ${categoryName}`;
            }

            backBtn.style.display = "block";
            
            // Hide grids
            consoleGrid.style.display = "none";
            otherHeaderWrapper.style.display = "none";
            otherGrid.style.display = "none";
            
            // Show List
            romListContainer.style.display = "block";
            searchInput.value = ""; // Clear search when navigating

            renderList(consolesMap[categoryName]);
        }

        function renderList(itemArray) {
            romListContainer.innerHTML = "";

            if (itemArray.length === 0) {
                romListContainer.innerHTML = `<div class="empty-state">NO_FILES_FOUND</div>`;
                return;
            }

            itemArray.forEach(item => {
                const row = document.createElement('div');
                row.className = 'rom-item';
                row.innerHTML = `
                    <div class="rom-info">
                        <span class="rom-name">${item.name}</span>
                        ${!currentViewConsole ? `<span class="rom-console-badge">[${item.console}]</span>` : ''}
                    </div>
                    <a class="download-btn" href="${item.downloadUrl}" download>DOWNLOAD</a>
                `;
                romListContainer.appendChild(row);
            });
        }

        function goHome() {
            searchInput.value = "";
            renderGrids();
        }

        // Search Functionality
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            if (!query) {
                if (currentViewConsole) showItemsForCategory(currentViewConsole);
                else renderGrids();
                return;
            }

            // Global search overrides current view
            viewTitle.textContent = `QUERY: "${query}"`;
            backBtn.style.display = "block";
            
            // Hide Grids
            consoleGrid.style.display = "none";
            otherHeaderWrapper.style.display = "none";
            otherGrid.style.display = "none";
            
            // Show List
            romListContainer.style.display = "block";

            const dataToSearch = currentViewConsole ? consolesMap[currentViewConsole] : allRoms;
            const results = dataToSearch.filter(item => 
                item.name.toLowerCase().includes(query)
            );

            // Temporarily set currentViewConsole to null to display category badges on search results
            const tempConsole = currentViewConsole;
            currentViewConsole = null; 
            renderList(results);
            currentViewConsole = tempConsole; // Restore state
        });

        // Initialize App
        init();
    </script>
</body>
</html>
