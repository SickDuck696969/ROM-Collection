<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROM Collection</title>
    <style>
        :root {
            --bg-dark: #070a0f;
            --bg-panel: #111a24;
            --bg-hover: #1a2736;
            --text-main: #e8e8e8;
            --text-muted: #8b9bb4;
            --accent-cyan: #32c8ff;
            --accent-pink: #ff3296;
            --accent-green: #32ff64;
            --gradient-primary: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
        }

        /* --- Custom Scrollbar --- */
        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-y: scroll;
        }

        /* --- Header / Navigation --- */
        header {
            background-color: rgba(17, 26, 36, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 50, 150, 0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        .brand h1 {
            margin: 0;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.6em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            font-weight: 800;
        }

        .search-container {
            flex-grow: 1;
            max-width: 450px;
            margin: 0 20px;
        }

        #searchInput {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(50, 200, 255, 0.3);
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1em;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput::placeholder { color: var(--text-muted); }
        #searchInput:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(50, 200, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.5);
        }

        .download-app-btn {
            background-color: var(--accent-green);
            color: #05140a;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(50, 255, 100, 0.2);
        }

        .download-app-btn:hover {
            transform: translateY(-2px);
            background-color: #5aff82;
            box-shadow: 0 6px 20px rgba(50, 255, 100, 0.4);
        }

        /* --- Main Content Area --- */
        main {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }

        .section-header h2 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .other-header {
            margin-top: 60px; /* spacing above the 'Other' section */
        }

        .back-btn {
            background-color: transparent;
            border: 1px solid var(--accent-pink);
            color: var(--accent-pink);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: none;
        }

        .back-btn:hover {
            background-color: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 50, 150, 0.4);
        }

        /* --- Grid System --- */
        .console-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }

        .console-card {
            background-color: var(--bg-panel);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Cool border gradient hover effect */
        .console-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 14px;
            padding: 2px;
            background: var(--gradient-primary);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .console-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .console-card:hover::before { opacity: 1; }

        .console-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background-color: #0c1219;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .card-content {
            padding: 20px 15px;
            text-align: center;
        }

        .console-title {
            font-weight: 700;
            font-size: 1.2em;
            color: var(--text-main);
            margin: 0 0 8px 0;
        }

        .item-count {
            font-size: 0.85em;
            color: var(--accent-cyan);
            background-color: rgba(50, 200, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- ROM List --- */
        .rom-list-container {
            display: none;
            background-color: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .rom-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background-color 0.2s;
        }

        .rom-item:last-child { border-bottom: none; }
        .rom-item:hover { background-color: var(--bg-hover); }
        
        .rom-info {
            display: flex;
            flex-direction: column;
        }

        .rom-name {
            font-size: 1.1em;
            font-weight: 600;
        }

        .rom-console-badge {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .download-btn {
            background-color: transparent;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background-color: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(50, 200, 255, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.2em;
            grid-column: 1 / -1;
        }

        @media (max-width: 700px) {
            header { flex-direction: column; text-align: center; padding: 15px; }
            .search-container { max-width: 100%; margin: 12px 0; }
            .console-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px;}
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1 onclick="goHome()">ROM Collection</h1>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search games, books, or music...">
        </div>
        <a class="download-app-btn" href="https://github.com/SickDuck696969/ROM_Downloader/releases/download/v1.0/ROM_Downloader.nro">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Switch App
        </a>
    </header>

    <main>
        <!-- Main Header -->
        <div class="section-header" id="mainHeaderWrapper">
            <h2 id="viewTitle">Select a Console</h2>
            <button id="backBtn" class="back-btn" onclick="goHome()">← Back to Categories</button>
        </div>

        <!-- Grid View for Consoles -->
        <div id="consoleGrid" class="console-grid">
            <div class="empty-state">Loading Database...</div>
        </div>

        <!-- Header for Other (eBook, Music) -->
        <div class="section-header other-header" id="otherHeaderWrapper" style="display: none;">
            <h2>Other Media</h2>
        </div>

        <!-- Grid View for Other Media -->
        <div id="otherGrid" class="console-grid" style="display: none;">
        </div>

        <!-- List View for ROMs (and Search Results) -->
        <div id="romListContainer" class="rom-list-container">
            <!-- Items injected here via JS -->
        </div>
    </main>

    <script>
        const MANIFEST_URL = "./manifest.json";
        
        let allRoms = [];
        let consolesMap = {};
        
        // DOM Elements
        const consoleGrid = document.getElementById('consoleGrid');
        const otherGrid = document.getElementById('otherGrid');
        const romListContainer = document.getElementById('romListContainer');
        
        const viewTitle = document.getElementById('viewTitle');
        const otherHeaderWrapper = document.getElementById('otherHeaderWrapper');
        const backBtn = document.getElementById('backBtn');
        const searchInput = document.getElementById('searchInput');

        // State
        let currentViewConsole = null;

        async function init() {
            try {
                const response = await fetch(MANIFEST_URL);
                const data = await response.json();
                
                // Parse Data
                data.forEach(item => {
                    if (!consolesMap[item.console]) {
                        consolesMap[item.console] = [];
                    }
                    if (item.name !== ".empty" && item.downloadUrl) {
                        consolesMap[item.console].push(item);
                        allRoms.push(item);
                    }
                });

                renderGrids();

            } catch (error) {
                consoleGrid.innerHTML = `<div class="empty-state">Failed to load manifest. Ensure you are viewing this on GitHub Pages.</div>`;
                console.error("Error fetching manifest:", error);
            }
        }

        function createCardHtml(categoryName, countLabel) {
            const count = consolesMap[categoryName].length;
            const coverUrl = `./${encodeURIComponent(categoryName)}/cover.png`;
            
            const card = document.createElement('div');
            card.className = 'console-card';
            card.onclick = () => showItemsForCategory(categoryName);
            
            card.innerHTML = `
                <img src="${coverUrl}" class="console-cover" alt="${categoryName} cover" 
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/400x400/0c1219/32c8ff?text=${encodeURIComponent(categoryName)}';">
                <div class="card-content">
                    <h3 class="console-title">${categoryName}</h3>
                    <span class="item-count">${count} ${countLabel}</span>
                </div>
            `;
            return card;
        }

        function renderGrids() {
            currentViewConsole = null;
            viewTitle.textContent = "Select a Console";
            backBtn.style.display = "none";
            romListContainer.style.display = "none";
            
            consoleGrid.style.display = "grid";
            consoleGrid.innerHTML = "";
            otherGrid.innerHTML = "";

            const categories = Object.keys(consolesMap).sort();

            // Split categories into Main Consoles and Other (eBook, Music)
            const mainConsoles = categories.filter(c => c !== 'eBook' && c !== 'Music');
            const otherCategories = categories.filter(c => c === 'eBook' || c === 'Music');

            // Render Main Consoles
            mainConsoles.forEach(consoleName => {
                const card = createCardHtml(consoleName, 'Games');
                consoleGrid.appendChild(card);
            });

            // Render Other Media
            if (otherCategories.length > 0) {
                otherHeaderWrapper.style.display = "flex";
                otherGrid.style.display = "grid";
                
                otherCategories.forEach(categoryName => {
                    // Logic to label eBook and Music correctly
                    const label = categoryName === 'eBook' ? 'Books' : 'Songs';
                    const card = createCardHtml(categoryName, label);
                    otherGrid.appendChild(card);
                });
            } else {
                otherHeaderWrapper.style.display = "none";
                otherGrid.style.display = "none";
            }
        }

        function showItemsForCategory(categoryName) {
            currentViewConsole = categoryName;
            
            // Adjust the view title based on what they clicked
            if (categoryName === 'eBook') {
                viewTitle.textContent = `Library: eBooks`;
            } else if (categoryName === 'Music') {
                viewTitle.textContent = `Library: Music`;
            } else {
                viewTitle.textContent = `${categoryName} ROMs`;
            }

            backBtn.style.display = "block";
            
            // Hide grids
            consoleGrid.style.display = "none";
            otherHeaderWrapper.style.display = "none";
            otherGrid.style.display = "none";
            
            // Show List
            romListContainer.style.display = "block";
            searchInput.value = ""; // Clear search when navigating

            renderList(consolesMap[categoryName]);
        }

        function renderList(itemArray) {
            romListContainer.innerHTML = "";

            if (itemArray.length === 0) {
                romListContainer.innerHTML = `<div class="empty-state">No files found.</div>`;
                return;
            }

            itemArray.forEach(item => {
                const row = document.createElement('div');
                row.className = 'rom-item';
                row.innerHTML = `
                    <div class="rom-info">
                        <span class="rom-name">${item.name}</span>
                        ${!currentViewConsole ? `<span class="rom-console-badge">${item.console}</span>` : ''}
                    </div>
                    <a class="download-btn" href="${item.downloadUrl}" download>Download</a>
                `;
                romListContainer.appendChild(row);
            });
        }

        function goHome() {
            searchInput.value = "";
            renderGrids();
        }

        // Search Functionality
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            if (!query) {
                if (currentViewConsole) showItemsForCategory(currentViewConsole);
                else renderGrids();
                return;
            }

            // Global search overrides current view
            viewTitle.textContent = `Search Results: "${query}"`;
            backBtn.style.display = "block";
            
            // Hide Grids
            consoleGrid.style.display = "none";
            otherHeaderWrapper.style.display = "none";
            otherGrid.style.display = "none";
            
            // Show List
            romListContainer.style.display = "block";

            const dataToSearch = currentViewConsole ? consolesMap[currentViewConsole] : allRoms;
            const results = dataToSearch.filter(item => 
                item.name.toLowerCase().includes(query)
            );

            // Temporarily set currentViewConsole to null to display category badges on search results
            const tempConsole = currentViewConsole;
            currentViewConsole = null; 
            renderList(results);
            currentViewConsole = tempConsole; // Restore state
        });

        // Initialize App
        init();
    </script>
</body>
</html>
